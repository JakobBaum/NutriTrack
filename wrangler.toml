name = "nutritrack"
main = "worker.js"
compatibility_date = "2024-01-01"

# Kostenschutz für den KI-Proxy (POST /): max. 20 Anfragen je IP und Minute.
# Fehlt das Binding (z.B. ältere Wrangler-Version), läuft der Worker ohne Limit weiter.
[[ratelimits]]
name = "AI_LIMITER"
namespace_id = "1001"

  [ratelimits.simple]
  limit = 20
  period = 60

# Optional: eigenes Limit fuer /off-search (sonst gilt AI_LIMITER). Eindeutige namespace_id waehlen.
# [[ratelimits]]
# name = "OFF_LIMITER"
# namespace_id = "1002"
#
#   [ratelimits.simple]
#   limit = 60
#   period = 60

# Globaler Tagesdeckel fuer KI-Aufrufe (WRK-01). Ohne dieses Binding laeuft der Worker OHNE Deckel
# weiter (fail-open, /health zeigt hasDailyCap=false). Ist das Binding gesetzt, KV aber ausgefallen: fail-closed (503). Foto-Aufrufe zaehlen doppelt. Einrichten:
#   npx wrangler kv namespace create DAILY_KV     -> gibt eine id aus, hier eintragen, Block einkommentieren
[[kv_namespaces]]
binding = "DAILY_KV"
id = "6d4c552cd18a41adaf58605f6853f9be"

[vars]
DAILY_AI_CAP = "500"   # max. KI-Aufrufe pro UTC-Tag (Standard 2000; KV-Free-Tier erlaubt ca. 1000 Schreibzugriffe pro Tag)
