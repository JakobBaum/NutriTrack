name: Deploy to GitHub Pages

# Baut die App und veröffentlicht sie unter
# https://jakobbaum.github.io/NutriTrack/ — bei jedem Push auf main.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build (base-href für Project Pages)
        run: npm run build -- --base-href /NutriTrack/

      - name: SPA-Fallback (404 = index.html für Client-Routing)
        run: cp www/index.html www/404.html

      - name: Jekyll aus (lässt _-Dateien zu)
        run: touch www/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: www

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
