name: CI und Deploy (GitHub Pages)

# CI (Lint, Typecheck, Unit-, Worker-Tests) und E2E laufen bei jedem Push und Pull Request. Der Pages-Deploy laeuft nur
# nach gruenem CI und nur fuer main -> https://jakobbaum.github.io/NutriTrack/
# Der Pages-Build geht nach dist/pages/browser, damit www/ (Capacitor webDir)
# davon unberuehrt bleibt.

on:
  push:
    branches: [main, weekly-recipes]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck (tsc)
        run: npx tsc -p tsconfig.app.json --noEmit

      - name: Lint (ng lint)
        run: npm run lint

      - name: Unit-Tests (ng test)
        run: npx ng test --watch=false

      - name: Worker-Tests
        run: node --test worker.test.mjs

      - name: Skript-Tests und Versions-Check
        run: |
          node --test scripts/sync-version.test.mjs
          node scripts/sync-version.mjs --check

  # E2E gegen den Produktions-Build (www/) mit statischem SPA-Fallback.
  # Playwright liegt bewusst ausserhalb von package.json (NT_PLAYWRIGHT_DIR), damit die Abhaengigkeiten unveraendert bleiben.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Playwright (ausserhalb des Repos) installieren
        run: |
          mkdir -p "$RUNNER_TEMP/pw"
          cd "$RUNNER_TEMP/pw"
          npm init -y
          npm install playwright@1.64.0
          npx playwright install --with-deps chromium
          echo "NT_PLAYWRIGHT_DIR=$RUNNER_TEMP/pw" >> "$GITHUB_ENV"

      - name: Produktions-Build (www/)
        run: npx ng build

      - name: E2E-Tests
        run: |
          node e2e/serve-static.mjs www 4310 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:4310/ > /dev/null && break; sleep 1; done
          E2E_BASE_URL=http://127.0.0.1:4310 node e2e/run.mjs

      - name: E2E-Artefakte (Screenshots bei Fehlern)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-artifacts
          path: e2e/artifacts
          if-no-files-found: ignore

  build:
    needs: [ci, e2e]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build (base-href fuer Project Pages, eigener Output-Pfad)
        run: npm run build:pages

      - name: SPA-Fallback (404 = index.html fuer Client-Routing)
        run: cp dist/pages/browser/index.html dist/pages/browser/404.html

      - name: Jekyll aus (laesst _-Dateien zu)
        run: touch dist/pages/browser/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/pages/browser

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
