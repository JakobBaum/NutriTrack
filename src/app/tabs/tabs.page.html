<ion-tabs>
  <ion-tab-bar slot="bottom">
    <ion-tab-button tab="dashboard" aria-label="Heute">
      <ion-icon name="today-outline" aria-hidden="true"></ion-icon>
      <ion-label>Heute</ion-label>
    </ion-tab-button>

    <ion-tab-button tab="diary" aria-label="Tagebuch">
      <ion-icon name="restaurant-outline" aria-hidden="true"></ion-icon>
      <ion-label>Tagebuch</ion-label>
    </ion-tab-button>

    <ion-tab-button tab="recipes" aria-label="Rezepte und Mahlzeiten">
      <ion-icon name="book-outline" aria-hidden="true"></ion-icon>
      <ion-label>Rezepte</ion-label>
    </ion-tab-button>

    <ion-tab-button tab="shopping" aria-label="Einkauf">
      <ion-icon name="cart-outline" aria-hidden="true"></ion-icon>
      <ion-label>Einkauf</ion-label>
    </ion-tab-button>

    <ion-tab-button tab="settings" aria-label="Profil">
      <ion-icon name="settings-outline" aria-hidden="true"></ion-icon>
      <ion-label>Profil</ion-label>
    </ion-tab-button>
  </ion-tab-bar>
</ion-tabs>
