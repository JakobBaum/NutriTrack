@if (plan(); as p) {
  @if (p.notices.length > 0) {
    <ul class="wp-notices" role="status" data-testid="wp-notices">
      @for (n of p.notices; track n) { <li>{{ n }}</li> }
    </ul>
  }
  @for (group of groups(); track group.meal) {
    <h2 class="nt-section-header wp-group">{{ group.label }}</h2>
    <ul class="wp-list" [attr.data-testid]="'wp-group-' + group.meal">
      @for (r of group.recipes; track r.id) {
        <li>
          <button type="button" class="wp-card" (click)="open(r)" [attr.aria-label]="r.title + ' ansehen'">
            <span class="wp-card__thumb">
              @if (r.imageUrl) { <img [src]="r.imageUrl" alt="" width="64" height="64" loading="lazy" /> } @else { <ion-icon name="restaurant-outline" aria-hidden="true"></ion-icon> }
            </span>
            <span class="wp-card__text">
              <span class="wp-card__title">{{ r.title }}</span>
              <span class="wp-card__meta">{{ meta(r) }}</span>
            </span>
            <ion-icon name="chevron-forward" class="wp-card__chev" aria-hidden="true"></ion-icon>
          </button>
        </li>
      }
    </ul>
  }
}
