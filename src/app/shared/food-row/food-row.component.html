<div class="text">
  <span class="name">{{ item().name }}</span>
  @if (isCustom() || subline()) {
    <span class="sub">
      @if (isCustom()) { <span class="own-tag">Eigen</span> }
      @if (subline()) { <span class="sub__text">{{ subline() }}</span> }
    </span>
  }
  <div class="meta-row">
    <span class="meta">{{ kcalText() }}@if (proteinText(); as protein) { · <strong class="meta__protein">{{ protein }}</strong>}{{ baseText() }}</span>
    @if (scoreLabel(); as label) {
      <span class="score" [class]="'score s-' + item().nutriscore" [attr.aria-label]="label"
            role="img">{{ item().nutriscore!.toUpperCase() }}</span>
    }
  </div>
</div>
